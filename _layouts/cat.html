---
layout: null
---
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        * { font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background: #eef0f3; color: #1a1a1a; }

        .page-wrapper { max-width: 860px; margin: 0 auto; padding: 32px 20px 64px; }

        /* ── Header 卡片 ── */
        .header-card {
            background: #fff; border: 1px solid #dde1e7; border-radius: 10px;
            padding: 20px 24px; margin-bottom: 14px;
            display: flex; align-items: center; gap: 14px;
        }
        .header-icon {
            width: 36px; height: 36px; background: #e8f0fe; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            color: #4a6cf7; flex-shrink: 0;
        }
        .header-title   { font-size: 17px; font-weight: 600; color: #111; line-height: 1.3; }
        .header-subtitle{ font-size: 13px; color: #7a8394; margin-top: 2px; }

        /* ── 主內容卡片 ── */
        .content-card { background: #fff; border: 1px solid #dde1e7; border-radius: 10px; overflow: hidden; }

        /* ── Tab 列 ── */
        .tab-bar {
            display: flex; border-bottom: 1px solid #eaecf0;
            padding: 0 4px; gap: 2px; background: #fff;
        }
        .tab-btn {
            display: flex; align-items: center; gap: 6px;
            padding: 12px 14px 11px; font-size: 13.5px; font-weight: 500;
            color: #6b7280; border: none; background: none; cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: color .15s, border-color .15s;
            white-space: nowrap; font-family: inherit;
        }
        .tab-btn:hover { color: #374151; }
        .tab-btn.active { color: #111; border-bottom-color: #4a6cf7; font-weight: 600; }

        /* ── 區塊標題列 ── */
        .section-header {
            display: flex; align-items: center; justify-content: space-between;
            flex-wrap: wrap; gap: 8px;
            padding: 13px 20px 11px; border-bottom: 1px solid #eaecf0;
        }
        .section-title { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; color: #374151; }
        .section-right {
            display: flex; align-items: center; gap: 8px;
            flex-wrap: wrap; justify-content: flex-end;
        }
        .count-badge {
            font-size: 11.5px; font-weight: 500; color: #6b7280;
            background: #f3f4f6; border: 1px solid #e5e7eb; border-radius: 20px; padding: 2px 9px;
            white-space: nowrap;
        }
        .search-wrap { position: relative; }
        .search-wrap svg {
            position: absolute; left: 9px; top: 50%; transform: translateY(-50%);
            color: #9ca3af; pointer-events: none;
        }
        .search-input {
            width: 190px; padding: 5px 10px 5px 29px; font-size: 12.5px; font-family: inherit;
            background: #f3f4f6; border: 1px solid #e5e7eb; border-radius: 6px; color: #374151;
            outline: none; transition: border-color .15s, background .15s, width .2s;
        }
        .search-input:focus { background: #fff; border-color: #93a5f5; width: 230px; }
        /* 搜尋框：窄版佔整行 */
        @media (max-width: 480px) {
            .section-right { width: 100%; }
            .search-wrap   { flex: 1; }
            .search-input  { width: 100%; }
            .search-input:focus { width: 100%; }
        }

        /* ── 1欄 Grid ── */
        .item-grid { display: grid; grid-template-columns: 1fr; }

        /* ── 每張卡片 ── */
        .card-wrap { border-bottom: 1px solid #eaecf0; }
        .card-wrap:last-child { border-bottom: none; }

        .card-main {
            display: flex; align-items: flex-start;
            gap: 14px; padding: 18px 20px 0;
        }

        .item-icon-wrap {
            width: 30px; height: 30px; border-radius: 7px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; margin-top: 3px;
        }
        .icon-primary       { background: #e8f4fd; color: #2f87c8; }
        .icon-supplementary { background: #eafaf1; color: #27ae60; }

        .card-body { flex: 1; min-width: 0; padding-bottom: 16px; }

        /* 標題列：標題 + 右側 meta，窄版 meta 換行 */
        .card-title-row {
            display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
        }
        .card-title {
            font-size: 15px; font-weight: 700; color: #111;
            display: flex; align-items: center; gap: 5px; line-height: 1.4;
            text-decoration: none; flex-shrink: 1; min-width: 0;
            word-break: break-word;
        }
        .card-title svg { color: #9ca3af; flex-shrink: 0; }
        .card-title:hover { color: #3b5bdb; }
        .card-title:hover svg { color: #3b5bdb; }

        /* 右側 meta：badge + chip，窄版時整個 meta 移到標題下方 */
        .card-meta {
            display: flex; align-items: center; gap: 5px;
            flex-shrink: 0; padding-top: 2px;
        }
        .tag-badge {
            font-size: 11px; font-weight: 500; padding: 3px 8px;
            border-radius: 5px; white-space: nowrap;
        }
        .tag-primary       { background: #e8f4fd; color: #2f87c8; border: 1px solid #c8e6f7; }
        .tag-supplementary { background: #eafaf1; color: #27ae60; border: 1px solid #b8edcf; }

        .file-chip {
            font-size: 11px; color: #9ca3af;
            background: #f3f4f6; border: 1px solid #e5e7eb; border-radius: 5px;
            padding: 3px 7px; font-family: 'SF Mono', 'Consolas', monospace; white-space: nowrap;
        }

        /* 窄版：meta 換到標題下一行；badge 隱藏，chip 常駐 */
        @media (max-width: 480px) {
            .card-title-row  { flex-direction: column; gap: 5px; }
            .card-meta       { padding-top: 0; }
            .tag-badge       { display: none; }
        }

        /* 說明：允許換行，避免截斷 */
        .card-desc {
            font-size: 13px; color: #4b5563;
            margin-top: 6px; line-height: 1.65;
            word-break: break-word; overflow-wrap: anywhere;
        }

        /* ── 子連結區 ── */
        .sub-section { padding: 0 20px 16px 44px; }
        @media (max-width: 480px) { .sub-section { padding-left: 20px; } }

        .sub-section-label {
            font-size: 11.5px; font-weight: 500; color: #9ca3af;
            letter-spacing: 0.04em; margin-bottom: 8px; margin-top: 4px;
        }
        .sub-link-list {
            border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden;
            background: #fff;
        }
        /* 子連結行：寬版橫排，窄版換行 */
        .sub-link-row {
            display: flex; align-items: center; justify-content: space-between;
            flex-wrap: wrap; gap: 4px;
            padding: 10px 14px; border-bottom: 1px solid #f0f2f5;
            text-decoration: none; color: #374151; font-size: 13px;
            transition: background .1s;
        }
        .sub-link-row:last-child { border-bottom: none; }
        .sub-link-row:hover { background: #f8f9fb; }
        .sub-link-left { display: flex; align-items: center; gap: 9px; min-width: 0; flex: 1; }
        .sub-link-left svg { color: #9ca3af; flex-shrink: 0; }
        .sub-link-text { color: #2563eb; font-weight: 500; word-break: break-word; }
        .sub-link-row:hover .sub-link-text { text-decoration: underline; }

        /* 子連結 badge：role 類型，不再用 file-chip */
        .sub-badge {
            font-size: 11px; padding: 2px 8px; border-radius: 5px;
            font-weight: 500; white-space: nowrap; flex-shrink: 0;
        }
        .sub-badge.sub-primary       { background: #e8f4fd; color: #2f87c8; border: 1px solid #c8e6f7; }
        .sub-badge.sub-supplementary { background: #eafaf1; color: #27ae60; border: 1px solid #b8edcf; }

        /* 窄版：badge 換行後佔整行；再更窄只顯示一個 */
        @media (max-width: 480px) {
            .sub-link-row  { flex-direction: column; align-items: flex-start; }
            .sub-badge     { align-self: flex-start; }
        }
        @media (max-width: 360px) {
            .sub-badge + .sub-badge { display: none; }
        }

        /* ── 無結果 ── */
        #noResults { padding: 48px 20px; text-align: center; color: #9ca3af; display: none; }
        #noResults p { font-size: 13px; margin-top: 8px; }

        /* ── Footer ── */
        .footer { text-align: center; margin-top: 24px; font-size: 12px; color: #b0b7c3; }
        .footer a { color: #9ca3af; text-decoration: none; }
        .footer a:hover { color: #374151; }

        /* ── Header：回上層按鈕 ── */
        .header-card { justify-content: space-between; }
        .header-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
        .back-btn {
            display: flex; align-items: center; gap: 5px;
            padding: 6px 11px; border-radius: 7px;
            font-size: 12.5px; font-weight: 500; color: #6b7280;
            background: #f3f4f6; border: 1px solid #e5e7eb;
            text-decoration: none; white-space: nowrap; flex-shrink: 0;
            transition: background .15s, color .15s, border-color .15s;
        }
        .back-btn svg { color: #9ca3af; transition: color .15s; }
        .back-btn:hover { background: #e8effe; color: #3b5bdb; border-color: #c5d2fb; }
        .back-btn:hover svg { color: #3b5bdb; }

        /* ── 回頁首懸浮按鈕 ── */
        #backToTop {
            position: fixed; bottom: 28px; right: 24px; z-index: 999;
            width: 40px; height: 40px; border-radius: 50%;
            background: #fff; border: 1px solid #dde1e7;
            box-shadow: 0 2px 8px rgba(0,0,0,.10);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: #6b7280;
            opacity: 0; pointer-events: none;
            transform: translateY(8px);
            transition: opacity .22s, transform .22s, background .15s, color .15s, border-color .15s;
        }
        #backToTop.visible { opacity: 1; pointer-events: auto; transform: translateY(0); }
        #backToTop:hover { background: #e8effe; color: #3b5bdb; border-color: #c5d2fb; }
    </style>
</head>
<body>
<div class="page-wrapper">

    <!-- Header 卡片 -->
    <div class="header-card">
        <div class="header-left">
            <div class="header-icon">
                <i data-lucide="layers" style="width:18px;height:18px;"></i>
            </div>
            <div>
                <div class="header-title">{{ page.title }}</div>
                <div class="header-subtitle">{{ page.description }}</div>
            </div>
        </div>
        <a class="back-btn" href="{{ page.dir | split: "/" | pop | join: "/" | prepend: "/" | append: "/" | relative_url }}">
            <i data-lucide="corner-left-up" style="width:13px;height:13px;"></i>
            上一層
        </a>
    </div>

    <!-- 主內容卡片 -->
    <div class="content-card">

        <!-- Tab 列 -->
        <div class="tab-bar" id="mainTabs">
            <button class="tab-btn active" data-tab="all">
                <i data-lucide="align-justify" style="width:14px;height:14px;"></i>所有內容
            </button>
            <button class="tab-btn" data-tab="primary">
                <i data-lucide="bookmark" style="width:14px;height:14px;"></i>主要內容
            </button>
            <button class="tab-btn" data-tab="supplementary">
                <i data-lucide="book-open" style="width:14px;height:14px;"></i>補充資料
            </button>
        </div>

        <!-- 區塊標題 + 搜尋 -->
        <div class="section-header">
            <div class="section-title">
                <i data-lucide="layers" style="width:13px;height:13px;"></i>
                <span id="sectionTitle">所有內容總覽</span>
            </div>
            <div class="section-right">
                <span class="count-badge" id="countBadge"></span>
                <div class="search-wrap">
                    <i data-lucide="search" style="width:13px;height:13px;"></i>
                    <input class="search-input" id="searchInput" placeholder="搜尋…" type="text">
                </div>
            </div>
        </div>

        <!-- 1欄 Grid：由 JS 依據下方 allPagesData 動態渲染 -->
        <div class="item-grid" id="itemGrid"></div>

        <!-- 無結果提示 -->
        <div id="noResults">
            <i data-lucide="search-x" style="width:26px;height:26px;margin:0 auto 10px;display:block;color:#d1d5db;"></i>
            <p>找不到符合的結果，請試試其他關鍵字。</p>
        </div>

    </div>

    <!-- 回頁首懸浮按鈕 -->
    <button id="backToTop" aria-label="回到頁首" onclick="window.scrollTo({top:0,behavior:'smooth'})">
        <i data-lucide="chevron-up" style="width:18px;height:18px;"></i>
    </button>
    <div class="footer">
        <span>© {{ site.time | date: "%Y" }} {{ page.title }}</span>
        &nbsp;·&nbsp;<a href="{{ '/' | relative_url }}">回首頁</a>
    </div>
</div>

<script>
    // ── Liquid 注入資料 ──────────────────────────────────────────
    const currentPageDir = {{ page.dir | jsonify }};
    const siteBaseUrl    = {{ site.baseurl | default: "" | jsonify }};

    // 建立 related 檔名 → 標題 / role 的對照表
    const titleMap = {};
    const roleMap  = {};
    {% for p in site.pages %}
        {% if p.dir == page.dir and p.url != page.url %}
        titleMap[{{ p.name | jsonify }}] = {{ p.title | default: p.name | jsonify }};
        roleMap[{{ p.name | jsonify }}]  = {{ p.role  | default: "primary" | jsonify }};
        {% endif %}
    {% endfor %}

    const allPagesData = [];
    {% for p in site.pages %}
        {% if p.dir == page.dir and p.url != page.url %}
        allPagesData.push({
            name:        {{ p.name        | jsonify }},
            url:         {{ p.url         | prepend: site.baseurl | jsonify }},
            title:       {{ p.title       | default: p.name | jsonify }},
            description: {{ p.description | default: "" | jsonify }},
            role:        {{ p.role        | default: "primary" | jsonify }},
            related:     {% if p.related %}{{ p.related | jsonify }}{% else %}[]{% endif %}
        });
        {% endif %}
    {% endfor %}

    // 按 title 排序
    allPagesData.sort((a, b) => a.title.localeCompare(b.title, 'zh-Hant'));

    // ── DOM 建構 ────────────────────────────────────────────────
    const ROLE_CONFIG = {
        primary:      { icon: 'bookmark',  label: '主要內容', iconClass: 'icon-primary',      badgeClass: 'tag-primary' },
        supplementary:{ icon: 'book-open', label: '補充資料', iconClass: 'icon-supplementary', badgeClass: 'tag-supplementary' }
    };

    function esc(str) {
        return String(str)
            .replace(/&/g,'&amp;').replace(/</g,'&lt;')
            .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function buildCard(p) {
        const cfg      = ROLE_CONFIG[p.role] || ROLE_CONFIG.primary;
        const filename = p.name;

        const relatedHTML = p.related.length ? `
            <div class="sub-section">
                <div class="sub-section-label">相關資源</div>
                <div class="sub-link-list">
                    ${p.related.map(rel => {
                        const relTitle = titleMap[rel]       || rel;
                        const relRole  = roleMap[rel]        || 'primary';
                        const relCfg   = ROLE_CONFIG[relRole] || ROLE_CONFIG.primary;
                        const relUrl   = siteBaseUrl + currentPageDir + rel;
                        return `<a href="${esc(relUrl)}" class="sub-link-row">
                            <span class="sub-link-left">
                                <i data-lucide="file-text" style="width:14px;height:14px;"></i>
                                <span class="sub-link-text">${esc(relTitle)}</span>
                            </span>
                            <span class="sub-badge sub-${relRole}">${relCfg.label}</span>
                        </a>`;
                    }).join('')}
                </div>
            </div>` : '';

        const descHTML = p.description
            ? `<div class="card-desc">${esc(p.description)}</div>` : '';

        const wrap = document.createElement('div');
        wrap.className = 'card-wrap';
        wrap.dataset.tab   = p.role || 'primary';
        wrap.dataset.title = p.title.toLowerCase();
        wrap.innerHTML = `
            <div class="card-main">
                <div class="item-icon-wrap ${cfg.iconClass}">
                    <i data-lucide="${cfg.icon}" style="width:15px;height:15px;"></i>
                </div>
                <div class="card-body">
                    <div class="card-title-row">
                        <a class="card-title" href="${esc(p.url)}">
                            ${esc(p.title)}
                            <i data-lucide="arrow-up-right" style="width:14px;height:14px;"></i>
                        </a>
                        <div class="card-meta">
                            <span class="tag-badge ${cfg.badgeClass}">${cfg.label}</span>
                            <span class="file-chip">${esc(filename)}</span>
                        </div>
                    </div>
                    ${descHTML}
                </div>
            </div>
            ${relatedHTML}`;
        return wrap;
    }

    const grid = document.getElementById('itemGrid');
    allPagesData.forEach(p => grid.appendChild(buildCard(p)));
    lucide.createIcons();

    // ── Tab / 搜尋邏輯 ───────────────────────────────────────────
    const noRes    = document.getElementById('noResults');
    const cntBadge = document.getElementById('countBadge');
    const secTitle = document.getElementById('sectionTitle');
    const tabLabels = { all: '所有內容總覽', primary: '主要內容總覽', supplementary: '補充資料總覽' };
    let currentTab = 'all', searchQ = '';

    function run() {
        const cards = Array.from(document.querySelectorAll('.card-wrap'));
        let visible = 0;
        cards.forEach(card => {
            const matchTab = currentTab === 'all' || card.dataset.tab === currentTab;
            const matchQ   = card.dataset.title.includes(searchQ);
            card.style.display = (matchTab && matchQ) ? '' : 'none';
            if (matchTab && matchQ) visible++;
        });
        noRes.style.display = visible === 0 ? 'block' : 'none';
        cntBadge.textContent = visible + ' 筆項目';
        secTitle.textContent = tabLabels[currentTab];
    }

    document.getElementById('mainTabs').addEventListener('click', e => {
        const btn = e.target.closest('.tab-btn');
        if (!btn) return;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTab = btn.dataset.tab;
        run();
    });

    document.getElementById('searchInput').addEventListener('input', e => {
        searchQ = e.target.value.toLowerCase().trim();
        run();
    });

    run();

    // ── 回頁首按鈕 ───────────────────────────────────────────────
    (function() {
        const fab = document.getElementById('backToTop');
        window.addEventListener('scroll', function() {
            fab.classList.toggle('visible', window.scrollY > 240);
        }, { passive: true });
    })();
</script>
</body>
</html>
